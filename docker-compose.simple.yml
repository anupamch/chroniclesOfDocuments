version: '3.8'

# Simplified version without Tesseract - uses vision models only
services:
  # MongoDB for development
  mongodb-dev:
    image: mongo:7
    container_name: chronicles-mongodb-dev
    ports:
      - "27017:27017"
    volumes:
      - mongodb_dev_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=chronicles
    networks:
      - chronicles-dev-network

  # ChromaDB for development
  chromadb-dev:
    image: chromadb/chroma:latest
    container_name: chronicles-chromadb-dev
    ports:
      - "8001:8000"
    volumes:
      - chromadb_dev_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    networks:
      - chronicles-dev-network

  # Backend without Tesseract (vision models only)
  backend-simple:
    build:
      context: ./backend
      dockerfile: Dockerfile.simple
    container_name: chronicles-backend-simple
    ports:
      - "8000:8000"
    volumes:
      - ./backend/documents:/app/documents
      - ./backend/output:/app/output
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2
      - OLLAMA_VISION_MODEL=llama3.2-vision
      - OCR_METHOD=vision
      - INPUT_FOLDER=/app/documents
      - OUTPUT_FOLDER=/app/output
      - MONGODB_URI=mongodb://mongodb-dev:27017
      - MONGODB_DB=chronicles
      - CHROMA_HOST=chromadb-dev
      - CHROMA_PORT=8000
    depends_on:
      - mongodb-dev
      - chromadb-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - chronicles-dev-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chronicles-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend-simple
    networks:
      - chronicles-dev-network

volumes:
  mongodb_dev_data:
  chromadb_dev_data:

networks:
  chronicles-dev-network:
    driver: bridge
