version: '3.8'

# Production setup with pre-built Ubuntu image (better for Windows Docker)
services:
  mongodb:
    image: mongo:7
    container_name: chronicles-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=chronicles
    networks:
      - chronicles-network

  chromadb:
    image: chromadb/chroma:latest
    container_name: chronicles-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    networks:
      - chronicles-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prebuilt
    container_name: chronicles-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/documents:/app/documents
      - ./backend/output:/app/output
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2
      - OCR_METHOD=tesseract
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB=chronicles
    depends_on:
      - mongodb
      - chromadb
    networks:
      - chronicles-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mongodb_data:
  chromadb_data:

networks:
  chronicles-network:
    driver: bridge
